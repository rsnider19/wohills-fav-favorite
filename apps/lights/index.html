<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Holiday Lights · Worthington Hills</title>
    <meta
      name="description"
      content="The Worthington Hills holiday lights showdown. Light up your house, find the brightest displays, and vote for your favorite."
    />
    <meta name="theme-color" content="#05060d" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph / social share. The card is public/og.jpg (1200×630), drawn from og-card.html
         by `npm run og-image -w apps/lights`. Absolute URLs: share scrapers need them. If the
         card changes, give it a new file name so apps that cached the old one fetch it again. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Worthington Hills Holiday Lights" />
    <meta property="og:url" content="https://holiday-lights.worthingtonhills.org/" />
    <meta property="og:title" content="Holiday Lights · Worthington Hills" />
    <meta
      property="og:description"
      content="The Worthington Hills holiday lights showdown. Light up your house, find the brightest displays, and vote for your favorite."
    />
    <meta property="og:image" content="https://holiday-lights.worthingtonhills.org/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Holiday Lights, Worthington Hills 2026: vote for the brightest house Dec 8–20. Enter your house Nov 28 – Dec 15."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://holiday-lights.worthingtonhills.org/og.jpg" />
    <meta
      name="twitter:image:alt"
      content="Holiday Lights, Worthington Hills 2026: vote for the brightest house Dec 8–20. Enter your house Nov 28 – Dec 15."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Doto:wght,ROND@900,100&family=Rubik:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
